# Umieść ten plik w repozytorium jako: .github/workflows/build-and-push.yml
name: build-and-push

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # pozwala odpalić ręcznie z zakładki Actions

permissions:
  contents: read
  packages: write           # potrzebne do push do GHCR (na wbudowanym GITHUB_TOKEN)

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true  # nowy push anuluje poprzedni, trwający build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login do GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build i push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
